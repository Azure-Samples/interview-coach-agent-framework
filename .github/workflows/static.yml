name: Build and deploy the workshop

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages-deployment' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reference history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch workshop reference tag
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          source_tag="$(jq -r '.sourceTag' workshop/labs/manifest.json)"
          if [[ ! "$source_tag" =~ ^(workshop-[a-z0-9.-]+|[0-9]+\.[0-9]+\.[0-9]+-workshop)$ ]]; then
            echo "::error::Invalid workshop source tag: $source_tag"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${source_tag}"; then
            echo "Using checked-out workshop reference tag: $source_tag"
          else
            repository="${HEAD_REPOSITORY:-${{ github.repository }}}"
            git fetch --no-tags "https://github.com/${repository}.git" \
              "refs/tags/${source_tag}:refs/tags/${source_tag}"
          fi
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workshop/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: workshop
      - name: Test checkpoint recipes
        run: npm test
        working-directory: workshop
      - name: Build and validate static site
        run: npm run build
        working-directory: workshop
      - name: Check Astro and TypeScript
        run: npm run check
        working-directory: workshop
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Compile isolated checkpoints
        run: npm run check:labs
        working-directory: workshop
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: workshop/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
