name: Build and deploy the workshop

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages-deployment' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reference history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch workshop reference tag
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          source_tag="$(jq -r '.sourceTag' workshop/labs/manifest.json)"
          if [[ ! "$source_tag" =~ ^(workshop-[a-z0-9.-]+|[0-9]+\.[0-9]+\.[0-9]+-workshop)$ ]]; then
            echo "::error::Invalid workshop source tag: $source_tag"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${source_tag}"; then
            echo "Using checked-out workshop reference tag: $source_tag"
          else
            repository="${HEAD_REPOSITORY:-${{ github.repository }}}"
            git fetch --no-tags "https://github.com/${repository}.git" \
              "refs/tags/${source_tag}:refs/tags/${source_tag}"
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workshop/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: workshop
      - name: Test checkpoint recipes
        run: npm test
        working-directory: workshop
      - name: Build and validate static site
        run: npm run build
        working-directory: workshop
      - name: Check Astro and TypeScript
        run: npm run check
        working-directory: workshop
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Compile isolated checkpoints
        run: npm run check:labs
        working-directory: workshop
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: workshop/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
