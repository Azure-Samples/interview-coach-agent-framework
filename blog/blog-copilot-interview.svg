<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Build an interview coach with GitHub Copilot SDK</title>
<desc id="description">A Blazor interview interface connects to agents orchestrated by Microsoft Agent Framework. The embedded GitHub Copilot SDK runtime handles model interactions and application tool calls. MarkItDown MCP reads documents. InterviewData MCP stores interview records in Cosmos DB. The sample does not expose built-in shell or filesystem tools.</desc>
